# Test specguard-mcp on every push and pull request. Typecheck + the node:test
# suite, nothing else — there is no lint step in this repo.
#
# The matrix is not decoration. `npm test` drives the runner with a glob
# (`.test-build/test/**/*.test.js`), and glob support in `node --test` landed in
# Node 22; before that the argument had to be a directory, and from Node 25 a
# directory argument is no longer scanned at all — it is resolved as a module
# and the run dies with MODULE_NOT_FOUND. One form does not cover every line, so
# every line the project claims gets run.
#
# Note this is the DEVELOPMENT floor, not the consumer one: `engines.node` stays
# at >=20 because a consumer only ever runs the compiled dist/, which has no such
# constraint. Only the test runner needs 22+.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # a break on one line should not hide the others
      matrix:
        node: ['22', '24', '25']

    env:
      SPECGUARD_ENDPOINT: https://specguard.yatfa.com
      # Repository-scoped ingest key for yatfa-ai/specguard-mcp. Absent on fork pull requests —
      # the telemetry step below is conditional on it.
      SPECGUARD_API_KEY: ${{ secrets.SPECGUARD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` runs `prepare`, which builds dist/ — so the build is already
      # exercised here and needs no separate step. This also builds the specguard-ts
      # git dependency's dist/, where the telemetry reporter below lives.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite reports itself through the node:test reporter that specguard-ts ships. The
      # reporter never fails the suite; with no key (a fork pull request) the flags are absent
      # and `npm test` runs exactly as before. Composing reporters requires a
      # --test-reporter-destination per --test-reporter whenever more than one is given (enforced
      # from Node 23; the pairing is valid on every version in the matrix). Each matrix leg is an
      # independent full run rather than a shard of one, so each stamps its own ci_run_id instead
      # of folding three executions into a single run on the platform.
      - name: Enable SpecGuard telemetry when a key is configured
        if: env.SPECGUARD_API_KEY != ''
        run: |
          {
            echo "SPECGUARD_REPORTER_ARGS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=./node_modules/specguard-ts/dist/node-test/reporter.js --test-reporter-destination=stdout"
            echo "SPECGUARD_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "SPECGUARD_BRANCH=${{ github.head_ref || github.ref_name }}"
            echo "SPECGUARD_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}"
          } >> "$GITHUB_ENV"

      - name: Run the suite
        run: npm test -- $SPECGUARD_REPORTER_ARGS
